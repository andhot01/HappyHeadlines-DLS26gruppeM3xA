global:
  scrape_interval: 5s
  
scrape_configs:
  - job_name: article-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - article-service-1:8080
          - article-service-2:8080
          - article-service-3:8080
  
  - job_name: comment-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - comment-service:8080