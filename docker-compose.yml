services:

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"

  structurizr:
    image: structurizr/structurizr
    command: ["local"]
    ports:
      - "8081:8080"
    volumes:
      - ./docs:/usr/local/structurizr

  article-db-africa:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_africa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  article-db-antarctica:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_antarctica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"

  article-db-asia:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_asia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"

  article-db-europe:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_europe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"

  article-db-north-america:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_north_america
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"

  article-db-south-america:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_south_america
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"

  article-db-oceania:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_oceania
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5439:5432"

  article-db-global:
    image: postgres:16
    environment:
      POSTGRES_DB: articles_global
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"

  article-service-1:
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      RabbitMQ__Host: article-queue
      ConnectionStrings__ArticleCache: article-cache:6379,abortConnect=false,connectTimeout=1000,syncTimeout=500
      ArticleCache__RefreshIntervalSeconds: 30
    ports:
      - "8084:8080"
    depends_on:
      - article-db-africa
      - article-db-antarctica
      - article-db-asia
      - article-db-europe
      - article-db-north-america
      - article-db-south-america
      - article-db-oceania
      - article-db-global

  article-service-2:
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      RabbitMQ__Host: article-queue
      ConnectionStrings__ArticleCache: article-cache:6379,abortConnect=false,connectTimeout=1000,syncTimeout=500
      ArticleCache__RefreshIntervalSeconds: 30
    depends_on:
      - article-db-africa
      - article-db-antarctica
      - article-db-asia
      - article-db-europe
      - article-db-north-america
      - article-db-south-america
      - article-db-oceania
      - article-db-global

  article-service-3:
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      RabbitMQ__Host: article-queue
      ConnectionStrings__ArticleCache: article-cache:6379,abortConnect=false,connectTimeout=1000,syncTimeout=500
      ArticleCache__RefreshIntervalSeconds: 30
    depends_on:
      - article-db-africa
      - article-db-antarctica
      - article-db-asia
      - article-db-europe
      - article-db-north-america
      - article-db-south-america
      - article-db-oceania
      - article-db-global

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3

  comment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5441:5432"

  profanity-db:
    image: postgres:16
    environment:
      POSTGRES_DB: profanity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5442:5432"

  comment-service:
    build:
      context: ./CommentService
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CommentCache: comment-cache:6379,abortConnect=false,connectTimeout=1000,syncTimeout=500
    ports:
      - "8082:8080"
    depends_on:
      - comment-db
      - profanity-service

  profanity-service:
    build:
      context: ./ProfanityService
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8083:8080"
    depends_on:
      - profanity-db

  draftdb:
    image: postgres:16
    environment:
      POSTGRES_DB: draftdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5443:5432"
    volumes:
      - draftdb_data:/var/lib/postgresql/data

  article-queue:
    image: rabbitmq:3-management
    container_name: article-queue
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  newsletter-service:
    build:
      context: .
      dockerfile: NewsletterService/Dockerfile
    container_name: newsletter-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      RabbitMQ__Host: article-queue
      ArticleService__BaseUrl: http://nginx
    ports:
      - "8085:8080"
    depends_on:
      article-queue:
        condition: service_healthy
      jaeger:
        condition: service_started
      nginx:
        condition: service_started

  publisher-service:
    build:
      context: .
      dockerfile: PublisherService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      RabbitMQ__Host: article-queue
    ports:
      - "8086:8080"
    depends_on:
      article-queue:
        condition: service_healthy
      jaeger:
        condition: service_started

  article-cache:
    image: redis:7-alpine
    container_name: article-cache
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      
  comment-cache:
    image: redis:7-alpine
    container_name: comment-cache
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      
volumes:
  draftdb_data:
  grafana_data: