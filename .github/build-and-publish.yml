name: Build and Publish Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: ArticleService
            image: article-service

          - service: CommentService
            image: comment-service

          - service: DraftService
            image: draft-service

          - service: NewsletterService
            image: newsletter-service

          - service: ProfanityService
            image: profanity-service

          - service: PublisherService
            image: publisher-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f ${{ matrix.service }}/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:1.0.${{ github.run_number }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:1.0.${{ github.run_number }}